<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Website Generator & GitHub Committer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem;
      margin: 0;
    }

    .container {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: var(--text);
    }

    p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    input:focus, textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background-color: var(--border);
      cursor: not-allowed;
    }

    #log {
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AI Web Generator → GitHub</h1>
    <p>Generate HTML/CSS using AI and push it directly to your GitHub repository.</p>

    <div class="grid">
      <div class="form-group">
        <label for="openaiKey">OpenAI API Key</label>
        <input type="password" id="openaiKey" placeholder="sk-proj-...">
      </div>
      <div class="form-group">
        <label for="githubToken">GitHub Token (PAT)</label>
        <input type="password" id="githubToken" placeholder="ghp_...">
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="repoOwner">GitHub Username</label>
        <input type="text" id="repoOwner" placeholder="your-username">
      </div>
      <div class="form-group">
        <label for="repoName">Repository Name</label>
        <input type="text" id="repoName" placeholder="my-web-project">
      </div>
    </div>

    <div class="form-group">
      <label for="prompt">Website Prompt</label>
      <textarea id="prompt" placeholder="Build a dark-mode portfolio landing page with a hero header, project list, and contact button..."></textarea>
    </div>

    <button id="generateBtn" onclick="runGenerator()">Generate & Commit to GitHub</button>

    <div id="log"></div>
  </div>

  <script>
    function log(message) {
      const logDiv = document.getElementById('log');
      logDiv.style.display = 'block';
      logDiv.textContent += message + '\n';
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function runGenerator() {
      const openaiKey = document.getElementById('openaiKey').value.trim();
      const githubToken = document.getElementById('githubToken').value.trim();
      const owner = document.getElementById('repoOwner').value.trim();
      const repo = document.getElementById('repoName').value.trim();
      const userPrompt = document.getElementById('prompt').value.trim();
      const btn = document.getElementById('generateBtn');

      if (!openaiKey || !githubToken || !owner || !repo || !userPrompt) {
        alert('Please fill out all fields.');
        return;
      }

      btn.disabled = true;
      document.getElementById('log').textContent = '';
      log('🤖 Requesting AI to generate website code...');

      try {
        // 1. Call OpenAI API directly from browser
        const aiResponse = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${openaiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-4o',
            messages: [
              {
                role: 'system',
                content: `Generate complete website code based on user prompts.
Return ONLY valid JSON format:
{
  "commit_message": "Add generated index.html",
  "files": [
    { "path": "index.html", "content": "<!DOCTYPE html>..." },
    { "path": "style.css", "content": "body { margin: 0; }" }
  ]
}`
              },
              { role: 'user', content: userPrompt }
            ],
            response_format: { type: 'json_object' }
          })
        });

        if (!aiResponse.ok) throw new Error(`OpenAI Error: ${aiResponse.statusText}`);
        const aiData = await aiResponse.json();
        const parsedCode = JSON.parse(aiData.choices[0].message.content);

        log(`✅ AI generated ${parsedCode.files.length} file(s).`);
        log(`📦 Preparing GitHub commit to ${owner}/${repo}...`);

        // Helper function for GitHub API headers
        const ghHeaders = {
          'Authorization': `Bearer ${githubToken}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        };

        // 2. Get reference to latest commit on main branch
        const refRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs/heads/main`, { headers: ghHeaders });
        if (!refRes.ok) throw new Error(`GitHub Ref Error: ${refRes.statusText}. Make sure repository and main branch exist.`);
        const refData = await refRes.json();
        const latestCommitSha = refData.object.sha;

        // 3. Create Blobs for each file
        log('🔨 Creating Git file blobs...');
        const treeItems = await Promise.all(parsedCode.files.map(async (file) => {
          const blobRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/blobs`, {
            method: 'POST',
            headers: ghHeaders,
            body: JSON.stringify({ content: file.content, encoding: 'utf-8' })
          });
          const blobData = await blobRes.json();
          return { path: file.path, mode: '100644', type: 'blob', sha: blobData.sha };
        }));

        // 4. Create new Git Tree
        log('🌳 Creating Git tree...');
        const treeRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees`, {
          method: 'POST',
          headers: ghHeaders,
          body: JSON.stringify({ base_tree: latestCommitSha, tree: treeItems })
        });
        const treeData = await treeRes.json();

        // 5. Create Commit
        log('✍️ Creating Commit...');
        const commitRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/commits`, {
          method: 'POST',
          headers: ghHeaders,
          body: JSON.stringify({
            message: parsedCode.commit_message || 'feat: AI website update',
            tree: treeData.sha,
            parents: [latestCommitSha]
          })
        });
        const commitData = await commitRes.json();

        // 6. Push commit (update ref)
        log('🚀 Pushing to main branch...');
        await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs/heads/main`, {
          method: 'PATCH',
          headers: ghHeaders,
          body: JSON.stringify({ sha: commitData.sha })
        });

        log(`🎉 SUCCESS! Pushed to GitHub.`);
        log(`🔗 Commit URL: https://github.com/${owner}/${repo}/commit/${commitData.sha}`);

      } catch (err) {
        log(`❌ Error: ${err.message}`);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
