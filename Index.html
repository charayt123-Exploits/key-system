<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Generator Portal</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .portal-card {
      position: relative;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem 2rem 2rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
    }

    /* Top Right Header / Cog */
    .header-actions {
      position: absolute;
      top: 1rem;
      right: 1rem;
    }

    .cog-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background-color 0.2s;
    }

    .cog-btn:hover {
      color: var(--text-main);
      background-color: var(--border-color);
    }

    .cog-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Dropdown Menu */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 3.2rem;
      right: 1rem;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem;
      width: 200px;
      text-align: left;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-menu label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dropdown-menu select {
      width: 100%;
      padding: 0.5rem;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 0.75rem;
      cursor: pointer;
    }

    .reset-btn {
      width: 100%;
      padding: 0.5rem;
      background-color: var(--danger-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .reset-btn:hover {
      background-color: var(--danger-hover);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    /* Main Action Button */
    .btn {
      width: 100%;
      padding: 0.9rem;
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      background-color: #334155;
      cursor: not-allowed;
      opacity: 0.8;
    }

    /* Key Display Box */
    .key-box {
      display: none;
      background-color: #020617;
      border: 1px dashed var(--accent-color);
      padding: 1.2rem;
      border-radius: 8px;
      font-family: monospace;
      font-size: 1.2rem;
      color: #60a5fa;
      margin-bottom: 1.5rem;
      word-break: break-all;
      user-select: all;
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <!-- Top Right Cog Button & Dropdown -->
    <div class="header-actions">
      <button class="cog-btn" onclick="toggleDropdown()" title="Settings">
        <svg viewBox="0 0 24 24">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>

      <div class="dropdown-menu" id="dropdownMenu">
        <label for="durationSelect">Key Duration</label>
        <select id="durationSelect">
          <option value="1">1 Hour</option>
          <option value="10">10 Hours</option>
          <option value="24" selected>24 Hours</option>
        </select>
        <button class="reset-btn" onclick="resetKey()">Reset Key</button>
      </div>
    </div>

    <h1 id="title">Key Generator</h1>
    <p id="description">Click the button below to generate your access key.</p>

    <!-- Key Display Box -->
    <div class="key-box" id="keyDisplay"></div>

    <!-- Generate Button -->
    <button class="btn" id="actionBtn" onclick="generateKey()">Generate Key</button>
  </div>

  <script>
    const actionBtn = document.getElementById('actionBtn');
    const title = document.getElementById('title');
    const description = document.getElementById('description');
    const keyDisplay = document.getElementById('keyDisplay');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const durationSelect = document.getElementById('durationSelect');

    // Check for an existing saved key on load
    window.addEventListener('DOMContentLoaded', loadSavedKey);

    function toggleDropdown() {
      dropdownMenu.classList.toggle('show');
    }

    // Close dropdown if user clicks outside
    window.addEventListener('click', (e) => {
      if (!e.target.closest('.header-actions')) {
        dropdownMenu.classList.remove('show');
      }
    });

    function loadSavedKey() {
      const savedData = localStorage.getItem('user_access_key_data');
      if (savedData) {
        const { key, durationHours } = JSON.parse(savedData);
        showCompletedState(key, durationHours);
      }
    }

    function generateKey() {
      const selectedHours = parseInt(durationSelect.value, 10);
      
      // Generate pseudo-random key
      const randomKey = 'KEY-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Date.now().toString().slice(-4);

      // Save key data in localStorage (remains saved until Reset is pressed)
      const keyData = { key: randomKey, durationHours: selectedHours };
      localStorage.setItem('user_access_key_data', JSON.stringify(keyData));

      showCompletedState(randomKey, selectedHours);
      dropdownMenu.classList.remove('show');
    }

    function resetKey() {
      localStorage.removeItem('user_access_key_data');
      
      // Reset UI back to initial state
      title.innerText = 'Key Generator';
      description.innerText = 'Click the button below to generate your access key.';
      keyDisplay.style.display = 'none';
      keyDisplay.innerText = '';
      
      actionBtn.innerText = 'Generate Key';
      actionBtn.disabled = false;

      dropdownMenu.classList.remove('show');
    }

    function showCompletedState(key, duration) {
      title.innerText = 'Key Active!';
      description.innerText = `Your ${duration}-hour access key is active. Use the Reset Key button in settings to remove it.`;

      keyDisplay.innerText = key;
      keyDisplay.style.display = 'block';

      actionBtn.innerText = `Active Key (${duration}h)`;
      actionBtn.disabled = true;
    }
  </script>
</body>
</html>
